<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- the window: Herdr's main layout, with Git in the terminals' spot -->
  <rect width="320" height="200" fill="#0b0d10"/>
  <!-- sidebar -->
  <rect width="72" height="200" fill="#111419"/>
  <circle cx="9" cy="9" r="2.5" fill="#ff5f57"/><circle cx="17" cy="9" r="2.5" fill="#febc2e"/><circle cx="25" cy="9" r="2.5" fill="#28c840"/>
  <g fill="#2a2f38">
    <rect x="8" y="24" width="40" height="5" rx="2"/>
    <rect x="8" y="35" width="52" height="6" rx="3" fill="#232832"/>
    <rect x="8" y="46" width="46" height="5" rx="2"/>
    <rect x="8" y="104" width="30" height="5" rx="2"/>
    <rect x="8" y="115" width="50" height="5" rx="2"/>
  </g>
  <rect x="72" width="1" height="200" fill="#20242b"/>
  <!-- tab bar: tabs, then Files and Changes, then the lit Octo Git button -->
  <rect x="73" width="247" height="16" fill="#111419"/>
  <rect x="73" y="16" width="247" height="1" fill="#20242b"/>
  <rect x="78" y="4" width="22" height="8" rx="3" fill="#232832"/>
  <rect x="104" y="4" width="16" height="8" rx="3" fill="#1a1e25"/>
  <rect x="124" y="4" width="16" height="8" rx="3" fill="#1a1e25"/>
  <rect x="226" y="4" width="22" height="8" rx="3" fill="#1a1e25"/>
  <rect x="251" y="4" width="26" height="8" rx="3" fill="#1a1e25"/>
  <rect x="281" y="3.5" width="34" height="9" rx="3" fill="#2b3a55"/>
  <rect x="285" y="6.5" width="3" height="3" rx="1" fill="#8fb4ff"/>
  <rect x="291" y="7" width="20" height="2" rx="1" fill="#dce6ff"/>
  <!-- Git, as a card: header, file tree and commit box, then the diff -->
  <rect x="76" y="20" width="241" height="166" rx="4" fill="#0f1216" stroke="#262b33"/>
  <rect x="80" y="25" width="12" height="3" rx="1" fill="#c9d1db"/>
  <rect x="96" y="24" width="24" height="5" rx="2" fill="#1c2129"/>
  <rect x="286" y="23.5" width="27" height="6" rx="2" fill="#e6e9ee"/>
  <rect x="76" y="33" width="241" height="1" fill="#262b33"/>
  <rect x="136" y="34" width="1" height="152" fill="#262b33"/>
  <g fill="#3a4150">
    <rect x="81" y="39" width="50" height="5" rx="2" fill="#1c2129"/>
    <rect x="81" y="50" width="4" height="4" rx="1" fill="#5b8cff"/><rect x="88" y="50.5" width="30" height="3" rx="1"/>
    <rect x="86" y="58" width="4" height="4" rx="1" fill="#5b8cff"/><rect x="93" y="58.5" width="26" height="3" rx="1"/>
    <rect x="91" y="66" width="4" height="4" rx="1"/><rect x="98" y="66.5" width="24" height="3" rx="1" fill="#6f9cf0"/>
    <rect x="91" y="74" width="4" height="4" rx="1" fill="#5b8cff"/><rect x="98" y="74.5" width="20" height="3" rx="1" fill="#6fcf8f"/>
    <rect x="91" y="82" width="4" height="4" rx="1"/><rect x="98" y="82.5" width="28" height="3" rx="1" fill="#6f9cf0"/>
    <rect x="86" y="90" width="4" height="4" rx="1"/><rect x="93" y="90.5" width="22" height="3" rx="1" fill="#e07a7a"/>
  </g>
  <rect x="81" y="152" width="51" height="22" rx="2" fill="none" stroke="#262b33"/>
  <rect x="112" y="177" width="20" height="5" rx="2" fill="#2a2f38"/>
  <!-- the diff: a file header, then old on the left and new on the right -->
  <rect x="137" y="34" width="180" height="9" fill="#14181d"/>
  <rect x="141" y="37" width="30" height="3" rx="1" fill="#6f9cf0"/>
  <rect x="226" y="34" width="1" height="152" fill="#262b33"/>
  <g fill="#2f3540">
    <rect x="141" y="48" width="60" height="2.5" rx="1"/><rect x="230" y="48" width="60" height="2.5" rx="1"/>
    <rect x="141" y="54" width="48" height="2.5" rx="1"/><rect x="230" y="54" width="48" height="2.5" rx="1"/>
  </g>
  <rect x="137" y="58.5" width="89" height="12" fill="#3a1d22"/>
  <rect x="227" y="58.5" width="90" height="18" fill="#17331f"/>
  <rect x="141" y="61" width="52" height="2.5" rx="1" fill="#e07a7a"/>
  <rect x="141" y="66" width="40" height="2.5" rx="1" fill="#e07a7a"/>
  <rect x="230" y="61" width="58" height="2.5" rx="1" fill="#6fcf8f"/>
  <rect x="230" y="66" width="44" height="2.5" rx="1" fill="#6fcf8f"/>
  <rect x="230" y="71" width="50" height="2.5" rx="1" fill="#6fcf8f"/>
  <g fill="#2f3540">
    <rect x="141" y="80" width="56" height="2.5" rx="1"/><rect x="230" y="80" width="56" height="2.5" rx="1"/>
    <rect x="141" y="86" width="36" height="2.5" rx="1"/><rect x="230" y="86" width="36" height="2.5" rx="1"/>
  </g>
  <!-- a review comment under a new line -->
  <rect x="236" y="92" width="74" height="18" rx="2" fill="#13221a" stroke="#2f6b45"/>
  <rect x="240" y="98" width="44" height="2.5" rx="1" fill="#9fb8a8"/>
  <rect x="137" y="116" width="180" height="9" fill="#14181d"/>
  <rect x="141" y="119" width="24" height="3" rx="1" fill="#6f9cf0"/>
  <g fill="#2f3540">
    <rect x="141" y="130" width="50" height="2.5" rx="1"/><rect x="230" y="130" width="50" height="2.5" rx="1"/>
  </g>
  <rect x="227" y="134.5" width="90" height="7" fill="#17331f"/>
  <rect x="230" y="137" width="40" height="2.5" rx="1" fill="#6fcf8f"/>
  <g fill="#2f3540">
    <rect x="141" y="146" width="44" height="2.5" rx="1"/><rect x="230" y="146" width="44" height="2.5" rx="1"/>
  </g>
  <!-- status bar -->
  <rect x="73" y="190" width="247" height="1" fill="#20242b"/>
  <rect x="78" y="193.5" width="30" height="3" rx="1" fill="#2a2f38"/>
  <rect x="112" y="193.5" width="22" height="3" rx="1" fill="#2a2f38"/>
</svg>
